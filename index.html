<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mój Tracker Nawyku</title>
  <link rel="manifest" href="data:application/manifest+json;utf8,{%22name%22:%22Tracker%20Nawyku%22,%22short_name%22:%22Nawyki%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%230f172a%22,%22theme_color%22:%22%233b82f6%22}">
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 480px; }
    h1 { font-size: 24px; text-align: center; color: #60a5fa; margin-bottom: 20px; }
    
    .card { background: #1e293b; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 10px; }
    input[type="text"] { background: #0f172a; border: 1px solid #334155; color: white; padding: 12px; border-radius: 8px; font-size: 16px; outline: none; }
    select { background: #0f172a; border: 1px solid #334155; color: white; padding: 12px; border-radius: 8px; font-size: 16px; }
    
    .btn { background: #2563eb; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .btn:active { transform: scale(0.98); }
    
    .section-title { font-size: 18px; margin: 15px 0 10px; font-weight: bold; }
    .good-title { color: #10b981; }
    .bad-title { color: #ef4444; }

    .habit-card { background: #1e293b; padding: 16px; border-radius: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border-left: 6px solid #2563eb; }
    .habit-card.good { border-left-color: #10b981; }
    .habit-card.bad { border-left-color: #ef4444; }
    
    .habit-info h3 { margin: 0 0 4px 0; font-size: 16px; }
    .habit-info p { margin: 0; font-size: 14px; color: #94a3b8; }
    
    .habit-actions { display: flex; gap: 8px; align-items: center; }
    .btn-action { border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; }
    .btn-good { background: #059669; }
    .btn-reset { background: #dc2626; }
    .btn-delete { background: transparent; color: #64748b; font-size: 18px; padding: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Mój Tracker Nawyków</h1>

    <!-- Formularz dodawania nawyku -->
    <div class="card">
      <div class="form-group">
        <input type="text" id="habitName" placeholder="Nazwa nawyku (np. Bieganie, Rzucenie cukru)">
        <select id="habitType">
          <option value="good">🟢 Dobry nawyk (chcę powtarzać)</option>
          <option value="bad">🔴 Zły nawyk (chcę unikać)</option>
        </select>
        <button class="btn" onclick="addHabit()">+ Dodaj nawyk</button>
      </div>
    </div>

    <!-- Lista Dobrych Nawyków -->
    <div class="section-title good-title">🟢 Dobre nawyki</div>
    <div id="goodHabitsList"></div>

    <!-- Lista Złych Nawyków -->
    <div class="section-title bad-title">🔴 Złe nawyki (Dni bez nawyku)</div>
    <div id="badHabitsList"></div>
  </div>

  <script>
    let habits = JSON.parse(localStorage.getItem('habitsList') || '[]');

    function saveHabits() {
      localStorage.setItem('habitsList', JSON.stringify(habits));
      renderHabits();
    }

    function addHabit() {
      const nameInput = document.getElementById('habitName');
      const typeInput = document.getElementById('habitType');
      const name = nameInput.value.trim();

      if (!name) return;

      habits.push({
        id: Date.now(),
        name: name,
        type: typeInput.value,
        streak: 0
      });

      nameInput.value = '';
      saveHabits();
    }

    function incrementStreak(id) {
      const habit = habits.find(h => h.id === id);
      if (habit) {
        habit.streak++;
        saveHabits();
      }
    }

    function resetStreak(id) {
      const habit = habits.find(h => h.id === id);
      if (habit && confirm('Czy na pewno złamałeś ten nawyk? Licznik wyzeruje się.')) {
        habit.streak = 0;
        saveHabits();
      }
    }

    function deleteHabit(id) {
      habits = habits.filter(h => h.id === id);
      saveHabits();
    }

    function renderHabits() {
      const goodList = document.getElementById('goodHabitsList');
      const badList = document.getElementById('badHabitsList');

      goodList.innerHTML = '';
      badList.innerHTML = '';

      const goodHabits = habits.filter(h => h.type === 'good');
      const badHabits = habits.filter(h => h.type === 'bad');

      if (goodHabits.length === 0) goodList.innerHTML = '<p style="color:#64748b; font-size: 14px;">Brak dobrych nawyków.</p>';
      if (badHabits.length === 0) badList.innerHTML = '<p style="color:#64748b; font-size: 14px;">Brak złych nawyków.</p>';

      goodHabits.forEach(h => {
        goodList.innerHTML += `
          <div class="habit-card good">
            <div class="habit-info">
              <h3>${h.name}</h3>
              <p>Seria: <strong>${h.streak} dni</strong></p>
            </div>
            <div class="habit-actions">
              <button class="btn-action btn-good" onclick="incrementStreak(${h.id})">+1 dzień ✅</button>
              <button class="btn-delete" onclick="deleteHabit(${h.id})">🗑️</button>
            </div>
          </div>
        `;
      });

      badHabits.forEach(h => {
        badList.innerHTML += `
          <div class="habit-card bad">
            <div class="habit-info">
              <h3>${h.name}</h3>
              <p>Czysty od: <strong>${h.streak} dni</strong></p>
            </div>
            <div class="habit-actions">
              <button class="btn-action btn-good" onclick="incrementStreak(${h.id})">+1 dzień 💪</button>
              <button class="btn-action btn-reset" onclick="resetStreak(${h.id})">Reset ⚠️</button>
              <button class="btn-delete" onclick="deleteHabit(${h.id})">🗑️</button>
            </div>
          </div>
        `;
      });
    }

    renderHabits();
  </script>
</body>
</html>

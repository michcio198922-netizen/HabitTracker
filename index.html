]<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mój Tracker Nawyku</title>
  <link rel="manifest" href="data:application/manifest+json;utf8,{%22name%22:%22Tracker%20Nawyku%22,%22short_name%22:%22Nawyki%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%230f172a%22,%22theme_color%22:%22%233b82f6%22}">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .card { background: #1e293b; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 400px; text-align: center; }
    h1 { font-size: 24px; margin-bottom: 8px; color: #60a5fa; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    .btn { background: #2563eb; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%; margin-top: 10px; transition: 0.2s; }
    .btn:active { transform: scale(0.98); background: #1d4ed8; }
    .pwa-btn { background: #059669; margin-bottom: 15px; display: none; }
    .streak { font-size: 48px; font-weight: bold; color: #f59e0b; margin: 20px 0; }
  </style>
</head>
<body>
  <div class="card">
    <button id="installBtn" class="btn pwa-btn">📲 ZAINSTALUJ APLIKACJĘ</button>
    <h1>Aplikacja Nawyki</h1>
    <p>Oznaczaj swój nawyk każdego dnia!</p>
    <div class="streak" id="streak">0 dni</div>
    <button class="btn" onclick="addDay()">Oznacz dzisiejszy dzień ✅</button>
  </div>

  <script>
    let count = parseInt(localStorage.getItem('habitStreak') || '0');
    document.getElementById('streak').innerText = count + ' dni';

    function addDay() {
      count++;
      localStorage.setItem('habitStreak', count);
      document.getElementById('streak').innerText = count + ' dni';
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('installBtn');
      btn.style.display = 'block';
      btn.addEventListener('click', () => {
        deferredPrompt.prompt();
      });
    });
  </script>
</body>
</html>

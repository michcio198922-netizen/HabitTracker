<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mój Tracker Nawyków Pro</title>
  
  <link rel="manifest" id="manifestPlaceholder">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script>
    // Generowanie ikony PWA
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#059669';
    ctx.beginPath();
    ctx.roundRect(0, 0, 512, 512, 100);
    ctx.fill();
    
    ctx.font = 'bold 300px sans-serif'; 
    ctx.fillStyle = 'white';
    ctx.textAlign = 'center'; 
    ctx.textBaseline = 'middle';
    ctx.fillText('✅', 256, 275);
    
    const iconDataUrl = canvas.toDataURL('image/png');

    const appleIcon = document.createElement('link');
    appleIcon.rel = 'apple-touch-icon';
    appleIcon.href = iconDataUrl;
    document.head.appendChild(appleIcon);

    const favicon = document.createElement('link');
    favicon.rel = 'icon';
    favicon.type = 'image/png';
    favicon.href = iconDataUrl;
    document.head.appendChild(favicon);

    const manifest = {
      name: "Tracker Nawyków",
      short_name: "Nawyki",
      start_url: "./",
      display: "standalone",
      background_color: "#0f172a",
      theme_color: "#2563eb",
      icons: [
        { src: iconDataUrl, sizes: "512x512", type: "image/png", purpose: "any" },
        { src: iconDataUrl, sizes: "512x512", type: "image/png", purpose: "maskable" }
      ]
    };
    const stringManifest = JSON.stringify(manifest);
    const blob = new Blob([stringManifest], {type: 'application/json'});
    document.getElementById('manifestPlaceholder').setAttribute('href', URL.createObjectURL(blob));
  </script>

  <style>
    :root {
      --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc;
      --text-muted: #94a3b8; --border-color: #334155; --primary: #2563eb;
      --good-color: #10b981; --bad-color: #ef4444; --accent: #f59e0b;
    }
    [data-theme="light"] {
      --bg-color: #f1f5f9; --card-bg: #ffffff; --text-main: #0f172a;
      --text-muted: #64748b; --border-color: #e2e8f0;
    }
    * { box-sizing: border-box; transition: background-color 0.2s, color 0.2s; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 500px; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    h1 { font-size: 20px; margin: 0; color: #60a5fa; }
    .date-badge { font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 16px; font-weight: 500; }
    
    .theme-toggle { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 13px; }

    .stats-card { background: var(--card-bg); padding: 16px; border-radius: 16px; border: 1px solid var(--border-color); display: flex; justify-content: space-around; text-align: center; margin-bottom: 20px; }
    .stat-val { font-size: 22px; font-weight: bold; color: var(--accent); }
    .stat-lbl { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .card { background: var(--card-bg); padding: 18px; border-radius: 16px; border: 1px solid var(--border-color); margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 10px; }
    input[type="text"], select { background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px; border-radius: 10px; font-size: 15px; outline: none; }
    
    .btn { background: var(--primary); color: white; border: none; padding: 12px; font-size: 15px; font-weight: bold; border-radius: 10px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; }

    .filters { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 4px; }
    .chip { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-muted); padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; whitespace: nowrap; }
    .chip.active { background: var(--primary); color: white; border-color: var(--primary); }

    .section-title { font-size: 16px; margin: 15px 0 10px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
    .good-title { color: var(--good-color); }
    .bad-title { color: var(--bad-color); }

    .habit-card { background: var(--card-bg); padding: 16px; border-radius: 14px; margin-bottom: 12px; border: 1px solid var(--border-color); border-left: 6px solid var(--primary); display: flex; flex-direction: column; gap: 10px; }
    .habit-card.good { border-left-color: var(--good-color); }
    .habit-card.bad { border-left-color: var(--bad-color); }

    .habit-header { display: flex; justify-content: space-between; align-items: center; }
    .habit-info h3 { margin: 0 0 4px 0; font-size: 16px; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--bg-color); color: var(--text-muted); border: 1px solid var(--border-color); margin-left: 6px; }
    .habit-info p { margin: 4px 0 0; font-size: 13px; color: var(--text-muted); }
    .created-date { font-size: 11px; color: var(--text-muted); opacity: 0.8; }

    .habit-actions { display: flex; gap: 6px; align-items: center; }
    .btn-action { border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; font-size: 13px; }
    .btn-good { background: #059669; }
    .btn-reset { background: #dc2626; }
    .btn-delete { background: transparent; color: var(--text-muted); font-size: 16px; border: none; cursor: pointer; padding: 4px 8px; }

    /* Pasek postępu procentowego */
    .progress-container { width: 100%; margin-top: 4px; }
    .progress-label { display: flex; justify-content: space-between; font-size: 12px; font-weight: bold; color: var(--text-muted); margin-bottom: 4px; }
    .progress-bar-bg { background: var(--bg-color); height: 8px; border-radius: 4px; overflow: hidden; width: 100%; border: 1px solid var(--border-color); }
    .progress-bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s ease; }
    .good .progress-bar-fill { background: var(--good-color); }
    .bad .progress-bar-fill { background: var(--bad-color); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Mój Tracker Nawyków</h1>
      <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 Tryb</button>
    </header>
    
    <div class="date-badge" id="currentDateDisplay">📅 Dzisiaj: Loading...</div>

    <!-- Statystyki -->
    <div class="stats-card">
      <div>
        <div class="stat-val" id="statTotal">0</div>
        <div class="stat-lbl">Nawyki</div>
      </div>
      <div>
        <div class="stat-val" id="statGood">0</div>
        <div class="stat-lbl">Dobre serii</div>
      </div>
      <div>
        <div class="stat-val" id="statOverallPct">0%</div>
        <div class="stat-lbl">Średnia skuteczność</div>
      </div>
    </div>

    <!-- Formularz -->
    <div class="card">
      <div class="form-group">
        <input type="text" id="habitName" placeholder="Nazwa nawyku (np. Bieganie, Rzucenie cukru)">
        <div style="display: flex; gap: 8px;">
          <select id="habitType" style="flex: 1;">
            <option value="good">🟢 Dobry nawyk</option>
            <option value="bad">🔴 Zły nawyk</option>
          </select>
          <select id="habitCategory" style="flex: 1;">
            <option value="Zdrowie">🏥 Zdrowie</option>
            <option value="Sport">⚽ Sport</option>
            <option value="Umysł">🧠 Umysł</option>
            <option value="Finanse">💰 Finanse</option>
            <option value="Inne">⭐ Inne</option>
          </select>
        </div>
        <button class="btn" onclick="addHabit()">+ Dodaj nowy nawyk</button>
      </div>
    </div>

    <!-- Filtry -->
    <div class="filters">
      <button class="chip active" onclick="filterHabits('all', this)">Wszystkie</button>
      <button class="chip" onclick="filterHabits('good', this)">🟢 Dobre</button>
      <button class="chip" onclick="filterHabits('bad', this)">🔴 Złe</button>
    </div>

    <!-- Listy Nawyków -->
    <div id="goodSection">
      <div class="section-title good-title">🟢 Dobre nawyki</div>
      <div id="goodHabitsList"></div>
    </div>

    <div id="badSection">
      <div class="section-title bad-title">🔴 Złe nawyki</div>
      <div id="badHabitsList"></div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
      `;
      const blob = new Blob([swCode], {type: 'application/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }

    function getTodayDateString() {
      const today = new Date();
      const day = String(today.getDate()).padStart(2, '0');
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const year = today.getFullYear();
      return `${day}.${month}.${year}`;
    }

    const todayFormatted = getTodayDateString();
    document.getElementById('currentDateDisplay').innerText = `📅 Dzisiaj: ${todayFormatted}`;

    // Bezpieczne wczytywanie danych z lokalnej pamięci
    function loadHabitsFromStorage() {
      try {
        const data = localStorage.getItem('habitsList');
        return data ? JSON.parse(data) : [];
      } catch(e) {
        return [];
      }
    }

    let habits = loadHabitsFromStorage();
    let currentFilter = 'all';

    function saveHabits() {
      localStorage.setItem('habitsList', JSON.stringify(habits));
      render();
    }

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') !== 'light';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('themeBtn').innerText = isDark ? '☀️ Jasny' : '🌙 Ciemny';
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
    }

    if (localStorage.getItem('theme') === 'light') {
      document.body.setAttribute('data-theme', 'light');
      document.getElementById('themeBtn').innerText = '☀️ Jasny';
    }

    function addHabit() {
      const nameInput = document.getElementById('habitName');
      const typeInput = document.getElementById('habitType');
      const catInput = document.getElementById('habitCategory');
      const name = nameInput.value.trim();

      if (!name) return;

      const newHabit = {
        id: Date.now(),
        name: name,
        type: typeInput.value,
        category: catInput.value,
        streak: 0,
        createdAtTimestamp: Date.now(),
        createdAtStr: todayFormatted
      };

      habits.push(newHabit);
      nameInput.value = '';
      saveHabits();
    }

    function incrementStreak(id) {
      const habit = habits.find(h => h.id === id);
      if (habit) { 
        habit.streak++; 
        saveHabits(); 
      }
    }

    function resetStreak(id) {
      const habit = habits.find(h => h.id === id);
      if (habit && confirm('Czy na pewno złamałeś ten nawyk? Licznik wyzeruje się.')) {
        habit.streak = 0; 
        saveHabits();
      }
    }

    function deleteHabit(id) {
      if (confirm('Czy na pewno chcesz usunąć ten nawyk?')) {
        habits = habits.filter(h => h.id !== id);
        saveHabits();
      }
    }

    function filterHabits(type, el) {
      currentFilter = type;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      render();
    }

    function calculateProgress(habit) {
      const createdAt = habit.createdAtTimestamp || habit.id;
      const diffMs = Date.now() - createdAt;
      const daysExist = Math.max(1, Math.ceil(diffMs / (1000 * 60 * 60 * 24)));
      const percentage = Math.min(100, Math.round((habit.streak / daysExist) * 100));
      return { daysExist, percentage };
    }

    function render() {
      const goodList = document.getElementById('goodHabitsList');
      const badList = document.getElementById('badHabitsList');
      const goodSec = document.getElementById('goodSection');
      const badSec = document.getElementById('badSection');

      goodList.innerHTML = ''; badList.innerHTML = '';
      let goodCount = 0;
      let totalPercentageSum = 0;

      const filtered = habits.filter(h => {
        if (currentFilter === 'good') return h.type === 'good';
        if (currentFilter === 'bad') return h.type === 'bad';
        return true;
      });

      filtered.forEach(h => {
        const { percentage } = calculateProgress(h);
        totalPercentageSum += percentage;

        const cardHtml = `
          <div class="habit-card ${h.type}">
            <div class="habit-header">
              <div class="habit-info">
                <h3>${h.name} <span class="badge">${h.category || 'Inne'}</span></h3>
                <p>${h.type === 'good' ? 'Seria' : 'Czysty od'}: <strong>${h.streak} dni</strong></p>
                <div class="created-date">Dodano: ${h.createdAtStr || todayFormatted}</div>
              </div>
              <div class="habit-actions">
                <button class="btn-action btn-good" onclick="incrementStreak(${h.id})">+1 d. ✅</button>
                ${h.type === 'bad' ? `<button class="btn-action btn-reset" onclick="resetStreak(${h.id})">Reset ⚠️️</button>` : ''}
                <button class="btn-delete" onclick="deleteHabit(${h.id})">🗑️</button>
              </div>
            </div>

            <div class="progress-container">
              <div class="progress-label">
                <span>Skuteczność</span>
                <span>${percentage}%</span>
              </div>
              <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width: ${percentage}%;"></div>
              </div>
            </div>
          </div>
        `;
        
        if (h.type === 'good') { goodList.innerHTML += cardHtml; goodCount += h.streak; }
        else { badList.innerHTML += cardHtml; }
      });

      goodSec.style.display = (currentFilter === 'bad') ? 'none' : 'block';
      badSec.style.display = (currentFilter === 'good') ? 'none' : 'block';

      if (goodList.innerHTML === '') goodList.innerHTML = '<p style="color:var(--text-muted); font-size: 13px;">Brak nawyków w tej sekcji.</p>';
      if (badList.innerHTML === '') badList.innerHTML = '<p style="color:var(--text-muted); font-size: 13px;">Brak nawyków w tej sekcji.</p>';

      const overallPct = filtered.length > 0 ? Math.round(totalPercentageSum / filtered.length) : 0;

      document.getElementById('statTotal').innerText = habits.length;
      document.getElementById('statGood').innerText = goodCount;
      document.getElementById('statOverallPct').innerText = `${overallPct}%`;
    }

    // Pierwsze wyrenderowanie danych po wczytaniu
    render();
  </script>
</body>
</html>
